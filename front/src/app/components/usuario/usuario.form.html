<form novalidate (submit)="submitForm($event)">
  <div class="flex-column">
    <label for="nombres">Nombre:</label>
    <input id="nombres" type="text" [formField]="usuarioForm.nombres" />
  </div>
  <div class="flex-column">
    <label for="apellidos">Apellido:</label>
    <input id="apellidos" type="text" [formField]="usuarioForm.apellidos" />
  </div>
  <div class="flex-column">
    <label for="username">Username:</label>
    <input id="username" type="text" [formField]="usuarioForm.username" />
  </div>
  <div class="flex-column">
    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
    <input id="fecha_nacimiento" type="date" [formField]="usuarioForm.fecha_nacimiento" />
  </div>

  <fieldset>
    <legend>Grupos:</legend>

    @for (grupo of grupos; track grupo) {
      <label>
        <input
          type="checkbox"
          [checked]="usuarioModel().grupos.includes(grupo)"
          (change)="onGrupoToggle(grupo, $event)"
        />
        {{ grupo }}
      </label>
    }
  </fieldset>

  <label>
    <input type="checkbox" [formField]="usuarioForm.activo" />
    Usuario activo
  </label>

  @if (usuarioModel().grupos.length === 0) {
    <p>Seleccioná al menos un grupo.</p>
  }
  <button type="submit" [disabled]="usuarioModel().grupos.length === 0">Guardar</button>
</form>
<p>Valores del formulario:</p>
<pre>{{ usuarioForm().value() | json }}</pre>

<h2>Tareas</h2>
<a routerLink="/tareas/crear">Crear tarea</a>

@if (tareaResource.isLoading()) {
  <p>Cargando tareas...</p>
} @else if (tareaResource.error()) {
  <p>No se pudieron cargar las tareas.</p>
} @else {
  <div class="lista-tareas">
    @for (tarea of tareaResource.value(); track tarea.id_tarea) {
      <app-tarea-card
        [tarea]="tarea"
        (editarTarea)="editarTarea($event)"
        (eliminarTarea)="eliminarTarea($event)"
      />
    } @empty {
      <p>No hay tareas registradas.</p>
    }
  </div>
}

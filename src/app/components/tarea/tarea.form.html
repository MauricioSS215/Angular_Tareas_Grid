<form novalidate (submit)="submitForm($event)">
  <label for="titulo">Título:</label>
  <input id="titulo" type="text" [formField]="tareaForm.titulo" />
  <br />
  <label for="descripcion">Descripción:</label>
  <textarea id="descripcion" [formField]="tareaForm.descripcion"></textarea>
  <br />
  <label for="grupo">Grupo:</label>
  <select id="grupo" [formField]="tareaForm.grupo">
    <option value="user">user</option>
    <option value="admin">admin</option>
    <option value="superadmin">superadmin</option>
  </select>
  <br />
  <label for="prioridad">Prioridad:</label>
  <select id="prioridad" [formField]="tareaForm.prioridad">
    <option value="0:baja">Baja</option>
    <option value="1:media">Media</option>
    <option value="2:alta">Alta</option>
  </select>
  <br />
  <button type="submit">Guardar</button>
</form>
<p>Valores del formulario:</p>
<pre>{{ tareaForm().value() | json }}</pre>
